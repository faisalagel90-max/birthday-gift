<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responses</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#25252a,#3a3a41);color:#eee;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px}.muted{color:#aaa}.card{background:#44444b;border:1px solid #5b5b63;border-radius:20px;padding:22px;margin:16px 0}.item{background:#303036;border-radius:16px;padding:18px;margin:12px 0}.label{color:#bbb;font-size:12px;text-transform:uppercase;letter-spacing:1px}.text{white-space:pre-wrap;line-height:1.65;margin-top:8px}button{border:0;background:#eee;color:#29292e;padding:11px 18px;border-radius:10px;cursor:pointer;margin-right:7px}</style></head><body><div class="wrap">
<div style="padding:28px 0"><div class="muted">PRIVATE VIEW</div><h1>Jawaban & Harapan 💭</h1><div class="muted">Apa yang ditulis di halaman hadiah.</div></div>
<div class="card"><button onclick="load()">↻ Refresh</button><button onclick="clearAll()">Hapus Semua</button> <span id="s" class="muted"></span></div><div id="box"></div></div>
<script>
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function load(){let j=await (await fetch("/api/responses")).json();s.textContent=j.items.length+" jawaban";box.innerHTML=j.items.length?"":"<div class='card'>Belum ada jawaban.</div>";j.items.slice().reverse().forEach(x=>{let d=new Date(x.createdAt);box.innerHTML+=`<div class="item"><div class="label">Doa & Harapan</div><div class="text">${esc(x.wish)}</div>${x.message?`<div class="label" style="margin-top:18px">Pesan</div><div class="text">${esc(x.message)}</div>`:""}<div class="muted" style="margin-top:14px;font-size:12px">${d.toLocaleString("id-ID")}</div></div>`})}
async function clearAll(){if(confirm("Hapus semua?")){await fetch("/api/responses",{method:"DELETE"});load()}}load();
</script></body></html>
