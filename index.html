<!-- KUE ULANG TAHUN -->
<div id="birthdayScene">

  <div class="birthday-title">
    <h2>Happy Special Day</h2>
    <h1>Arsya Surya Sanjaya</h1>
    <div class="age">19</div>
  </div>

  <div class="cake" id="cake">
    <div class="candle">🕯️</div>
    <div class="cake-body">🎂</div>
  </div>

  <p id="candleText">Tekan kuenya 🎂</p>

</div>

<style>
#birthdayScene {
  text-align: center;
  margin: 25px auto;
  position: relative;
  min-height: 430px;
  overflow: hidden;
}

.birthday-title h2 {
  margin: 5px 0;
  color: #d94f87;
  font-size: 25px;
}

.birthday-title h1 {
  margin: 5px 10px 0;
  color: #b83268;
  font-size: 24px;
}

.age {
  font-size: 70px;
  font-weight: bold;
  color: #e85d9e;
  margin-top: 0;
}

.cake {
  display: inline-block;
  position: relative;
  cursor: pointer;
  margin-top: 5px;
  padding: 10px;
  user-select: none;
  transition: transform .2s;
  z-index: 5;
}

.cake:active {
  transform: scale(1.12);
}

.cake-body {
  font-size: 115px;
  line-height: 1;
}

.candle {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 42px;
}

#candleText {
  color: #d94f87;
  font-weight: bold;
  margin-top: 0;
}

.flying-balloon {
  position: absolute;
  bottom: -80px;
  font-size: 45px;
  z-index: 10;
  pointer-events: none;
  animation: flyUp linear forwards;
}

@keyframes flyUp {
  0% {
    bottom: -80px;
    opacity: 0;
    transform: translateX(0) rotate(0deg);
  }

  10% {
    opacity: 1;
  }

  50% {
    transform: translateX(40px) rotate(8deg);
  }

  100% {
    bottom: 110%;
    opacity: 0;
    transform: translateX(-40px) rotate(-8deg);
  }
}

.flying-heart {
  position: fixed;
  bottom: 20px;
  font-size: 25px;
  pointer-events: none;
  z-index: 9999;
  animation: heartUp 2.5s ease-out forwards;
}

@keyframes heartUp {
  0% {
    transform: translateY(0) scale(.7);
    opacity: 1;
  }

  100% {
    transform: translateY(-80vh) scale(1.3);
    opacity: 0;
  }
}
</style>

<script>
const cake = document.getElementById("cake");
const candleText = document.getElementById("candleText");

let musicStarted = false;

/* Musik Happy Birthday */
function playHappyBirthday() {

  if (musicStarted) return;
  musicStarted = true;

  const AudioContext =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContext) return;

  const audioCtx = new AudioContext();

  const notes = [
    264,264,297,264,352,330,
    264,264,297,264,396,352,
    264,264,528,440,352,330,297,
    466,466,440,352,396,352
  ];

  let time = audioCtx.currentTime;

  notes.forEach((frequency, index) => {

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(0.001, time);
    gain.gain.exponentialRampToValueAtTime(
      0.18,
      time + 0.03
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      time + 0.38
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start(time);
    oscillator.stop(time + 0.4);

    time += 0.42;
  });
}

/* Saat kue ditekan */
cake.addEventListener("click", function() {

  candleText.innerHTML =
    "🎉 Happy Birthday Arsya! 🎈💗";

  playHappyBirthday();

  /* Balon keluar dari bawah */
  const balloons = [
    "🎈","🎈","🎈","🎈","🎈",
    "🎈","🎈","🎈","🎈","🎈",
    "🎈","🎈","🎈","🎈","🎈"
  ];

  balloons.forEach(function(symbol, index) {

    const balloon = document.createElement("div");

    balloon.className = "flying-balloon";
    balloon.innerHTML = symbol;

    balloon.style.left =
      (5 + Math.random() * 90) + "%";

    balloon.style.animationDuration =
      (3 + Math.random() * 3) + "s";

    balloon.style.animationDelay =
      (index * 0.12) + "s";

    document.getElementById("birthdayScene")
      .appendChild(balloon);

    setTimeout(function() {
      balloon.remove();
    }, 7000);
  });

  /* Efek hati */
  for (let i = 0; i < 18; i++) {

    const heart = document.createElement("div");

    heart.className = "flying-heart";
    heart.innerHTML = "💗";

    heart.style.left =
      (Math.random() * 100) + "vw";

    heart.style.animationDelay =
      (Math.random() * 1) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
      heart.remove();
    }, 3500);
  }

});
</script>
</body>
</html>
