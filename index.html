<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Arsya Surya Sanjaya</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 50% 45%,
      #c878df 0%,
      #963eb1 45%,
      #5c2878 100%);
}

/* =========================
   LAYAR
========================= */

.screen{
  width:100vw;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:10px;

  position:relative;
  overflow:hidden;
}

/* =========================
   KARTU UTAMA
========================= */

.card{
  width:min(88vw,620px);
  height:96vh;

  position:relative;
  overflow:hidden;

  border-radius:30px;

  border:3px solid rgba(255,255,255,.75);

  background:
    linear-gradient(
      180deg,
      #ffd9ee 0%,
      #ffc5e3 48%,
      #f8b9dc 100%
    );

  box-shadow:
    0 0 30px rgba(255,150,225,.45),
    0 15px 40px rgba(45,10,65,.45);

  text-align:center;

  padding:14px 12px;

  display:flex;
  flex-direction:column;
  align-items:center;

  z-index:2;
}

/* =========================
   HIASAN
========================= */

.sparkle{
  position:absolute;
  color:white;
  opacity:.8;
  font-size:20px;
  animation:twinkle 2s infinite alternate;
}

.s1{top:25px;left:15px}
.s2{top:70px;right:18px}
.s3{bottom:120px;left:10px}
.s4{bottom:45px;right:15px}

@keyframes twinkle{
  from{opacity:.25;transform:scale(.8)}
  to{opacity:1;transform:scale(1.2)}
}

/* =========================
   PITA ATAS
========================= */

.ribbon{
  position:relative;
  width:120px;
  height:45px;
  margin-bottom:2px;
}

.ribbon:before,
.ribbon:after{
  content:"";
  position:absolute;
  top:3px;
  width:58px;
  height:34px;
  background:linear-gradient(135deg,#f45fb3,#b52c91);
  border-radius:8px 25px 8px 25px;
}

.ribbon:before{
  left:0;
  transform:rotate(25deg);
}

.ribbon:after{
  right:0;
  transform:scaleX(-1) rotate(25deg);
}

.ribbon-heart{
  position:absolute;
  left:50%;
  top:5px;
  transform:translateX(-50%);
  z-index:3;

  width:43px;
  height:38px;

  border-radius:50%;
  background:linear-gradient(145deg,#ff9ed4,#e5329b);

  color:white;
  font-size:27px;
  line-height:38px;

  box-shadow:0 4px 10px rgba(150,30,100,.25);
}

/* =========================
   JUDUL KECIL
========================= */

.top-text{
  color:#a33b78;
  font-size:12px;
  letter-spacing:4px;
  font-weight:bold;

  margin-top:0;
}

/* =========================
   HAPPY BIRTHDAY
========================= */

.title{
  margin:8px 0 0;

  color:#c92d8c;

  font-size:clamp(42px,10vw,72px);

  line-height:.84;

  font-weight:bold;

  text-shadow:
    0 3px 0 rgba(255,255,255,.35),
    0 5px 10px rgba(130,30,90,.15);
}

/* =========================
   NAMA
========================= */

.name{
  color:#71377e;

  font-size:clamp(19px,4.8vw,30px);

  font-weight:bold;

  margin-top:9px;
}

/* =========================
   KUE
========================= */

.cake-area{
  position:relative;

  width:min(68vw,390px);
  height:min(38vh,310px);

  margin-top:3px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  user-select:none;
}

.cake{
  font-size:clamp(150px,39vw,270px);

  line-height:1;

  filter:
    drop-shadow(0 10px 8px rgba(120,40,100,.2));

  transition:.25s;
}

.cake-area:active .cake{
  transform:scale(1.04);
}

/* Lilin */

.candle{
  position:absolute;

  top:3px;
  left:50%;

  transform:translateX(-50%);

  font-size:clamp(42px,10vw,65px);

  z-index:5;

  cursor:pointer;

  transition:.3s;
}

.candle.off{
  filter:grayscale(1);
  opacity:.55;
  transform:
    translateX(-50%)
    scale(.85);
}

/* =========================
   ANGKA 19
========================= */

.age{
  color:#ec82b8;

  font-size:clamp(68px,18vw,125px);

  line-height:.65;

  font-weight:bold;

  text-shadow:
    2px 3px 0 #fff0f8,
    0 5px 10px rgba(130,30,90,.15);

  margin-top:-4px;
}

/* =========================
   INSTRUKSI
========================= */

.instruction{
  color:#9b477c;

  font-size:clamp(11px,3vw,16px);

  font-weight:bold;

  margin-top:7px;
}

.instruction.off{
  color:#c32b88;
}

/* =========================
   GARIS + TEKS
========================= */

.divider{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;

  margin-top:5px;
}

.divider span{
  width:70px;
  height:2px;
  background:#d783ad;
}

.divider b{
  color:#a72b7b;
  font-size:18px;
}

.special{
  color:white;

  font-size:clamp(15px,4vw,23px);

  line-height:1.05;

  font-weight:bold;

  text-shadow:
    0 2px 3px rgba(100,40,80,.15);

  margin-top:4px;
}

/* =========================
   KADO
========================= */

.gift-area{
  margin-top:3px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.gift{
  font-size:clamp(65px,18vw,115px);

  line-height:.8;

  filter:
    drop-shadow(0 7px 6px rgba(100,30,90,.2));
}

.gift-button{
  margin-top:4px;

  padding:8px 27px;

  border-radius:30px;

  color:white;

  text-decoration:none;

  font-size:clamp(14px,3.8vw,19px);

  font-weight:bold;

  background:
    linear-gradient(
      135deg,
      #f14cab,
      #a53bc0
    );

  border:2px solid rgba(255,255,255,.55);

  box-shadow:
    0 5px 15px rgba(130,30,110,.3);
}

.gift-button:active{
  transform:scale(.94);
}

/* =========================
   BALON
========================= */

.balloon{
  position:fixed;

  bottom:-90px;

  width:32px;
  height:42px;

  border-radius:50%;

  z-index:999;

  pointer-events:none;

  animation:
    rise 4s linear forwards;
}

.balloon:before{
  content:"";

  position:absolute;

  bottom:-5px;
  left:50%;

  margin-left:-5px;

  border-left:5px solid transparent;
  border-right:5px solid transparent;
  border-top:8px solid currentColor;
}

.balloon:after{
  content:"";

  position:absolute;

  top:40px;
  left:50%;

  width:1px;
  height:65px;

  background:rgba(70,40,70,.5);
}

@keyframes rise{
  0%{
    bottom:-90px;
    opacity:0;
    transform:translateX(0) rotate(-5deg);
  }

  10%{
    opacity:1;
  }

  50%{
    transform:translateX(35px) rotate(8deg);
  }

  100%{
    bottom:110vh;
    opacity:0;
    transform:translateX(-35px) rotate(-8deg);
  }
}

/* =========================
   LOVE
========================= */

.love{
  position:fixed;

  bottom:-50px;

  z-index:1000;

  color:white;

  font-size:28px;

  pointer-events:none;

  animation:
    loveRise 3.8s linear forwards;
}

@keyframes loveRise{
  0%{
    bottom:-50px;
    opacity:0;
    transform:scale(.5);
  }

  15%{
    opacity:1;
  }

  100%{
    bottom:110vh;
    opacity:0;
    transform:
      translateX(40px)
      scale(1.3);
  }
}

/* =========================
   LAYAR PENDEK
========================= */

@media(max-height:720px){

  .card{
    padding-top:9px;
  }

  .ribbon{
    transform:scale(.75);
    height:32px;
  }

  .top-text{
    font-size:10px;
  }

  .title{
    font-size:48px;
    margin-top:3px;
  }

  .name{
    font-size:18px;
    margin-top:5px;
  }

  .cake-area{
    height:28vh;
  }

  .cake{
    font-size:145px;
  }

  .candle{
    font-size:40px;
  }

  .age{
    font-size:75px;
  }

  .gift{
    font-size:65px;
  }

  .special{
    font-size:15px;
  }

  .instruction{
    font-size:10px;
  }

  .gift-button{
    padding:6px 22px;
    font-size:14px;
  }
}

/* =========================
   LAYAR SANGAT PENDEK
========================= */

@media(max-height:600px){

  .card{
    padding-top:5px;
  }

  .ribbon{
    display:none;
  }

  .title{
    font-size:42px;
  }

  .cake-area{
    height:25vh;
  }

  .cake{
    font-size:120px;
  }

  .age{
    font-size:65px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <div class="card" id="card">

    <div class="sparkle s1">♡</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">♡</div>
    <div class="sparkle s4">✦</div>

    <!-- PITA -->
    <div class="ribbon">
      <div class="ribbon-heart">♥</div>
    </div>

    <!-- JUDUL -->
    <div class="top-text">
      ♥ A LITTLE BIRTHDAY GIFT ♥
    </div>

    <div class="title">
      Happy<br>Birthday
    </div>

    <div class="name">
      Arsya Surya Sanjaya
    </div>

    <!-- KUE -->
    <div
      class="cake-area"
      id="cakeArea"
      title="Tekan lilinnya"
    >

      <div
        class="candle"
        id="candle"
      >
        🕯️
      </div>

      <div class="cake">
        🎂
      </div>

    </div>

    <!-- 19 -->
    <div class="age">
      19
    </div>

    <div
      class="instruction"
      id="instruction"
    >
      Tekan lilinnya 🕯️
    </div>

    <div class="divider">
      <span></span>
      <b>♥</b>
      <span></span>
    </div>

    <div class="special">
      Untuk seseorang yang<br>
      spesial 🤍
    </div>

    <!-- KADO -->
    <div class="gift-area">

      <div class="gift">
        🎁
      </div>

      <a
        href="public/gift.html"
        class="gift-button"
      >
        🎁 &nbsp; Buka Hadiah
      </a>

    </div>

  </div>

</div>


<script>

/* =========================
   LILIN
========================= */

const candle =
  document.getElementById("candle");

const card =
  document.getElementById("card");

const instruction =
  document.getElementById("instruction");

let alreadyPressed = false;


/* =========================
   MUSIK HAPPY BIRTHDAY
========================= */

function playBirthdayMusic(){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const ctx =
    new AudioContext();

  const notes = [

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [352,.5],
    [330,.8],

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [396,.5],
    [352,.8],

    [264,.25],
    [264,.25],
    [528,.5],
    [440,.5],
    [352,.5],
    [330,.5],
    [297,.8],

    [466,.25],
    [466,.25],
    [440,.5],
    [352,.5],
    [396,.5],
    [352,1]

  ];

  let time =
    ctx.currentTime;

  notes.forEach(function(n){

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.type="sine";

    osc.frequency.value=n[0];

    gain.gain.setValueAtTime(
      .001,
      time
    );

    gain.gain.linearRampToValueAtTime(
      .18,
      time+.03
    );

    gain.gain.linearRampToValueAtTime(
      .001,
      time+n[1]
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(time);

    osc.stop(
      time+n[1]+.02
    );

    time += n[1]+.04;

  });
}


/* =========================
   BALON
========================= */

function createBalloons(){

  const colors = [

    "#ff4fa3",
    "#ff76c8",
    "#b76cff",
    "#8e5cff",
    "#ff4f72",
    "#ff9cce",
    "#d45cff",
    "#f35ca8"

  ];

  for(let i=0;i<32;i++){

    const balloon =
      document.createElement("div");

    balloon.className =
      "balloon";

    const color =
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    balloon.style.background =
      color;

    balloon.style.color =
      color;

    balloon.style.left =
      Math.random()*100+"vw";

    balloon.style.animationDuration =
      (3+
      Math.random()*2.5)+"s";

    balloon.style.animationDelay =
      Math.random()*1.2+"s";

    document.body.appendChild(
      balloon
    );

    setTimeout(
      ()=>{
        balloon.remove();
      },
      6500
    );
  }
}


/* =========================
   LOVE PUTIH
========================= */

function createLove(){

  for(let i=0;i<35;i++){

    const love =
      document.createElement("div");

    love.className =
      "love";

    love.textContent =
      "🤍";

    love.style.left =
      Math.random()*100+"vw";

    love.style.animationDuration =
      (2.8+
      Math.random()*2.5)+"s";

    love.style.animationDelay =
      Math.random()*1.2+"s";

    document.body.appendChild(
      love
    );

    setTimeout(
      ()=>{
        love.remove();
      },
      6000
    );
  }
}


/* =========================
   KETIKA LILIN DITEKAN
========================= */

candle.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    if(alreadyPressed) return;

    alreadyPressed=true;

    /* lilin mati */

    candle.classList.add("off");

    instruction.textContent =
      "🎉 Happy Birthday to You! 🤍";

    instruction.classList.add("off");


    /* musik */

    playBirthdayMusic();


    /* balon */

    createBalloons();


    /* love */

    createLove();

  }
);

</script>

</body>
</html>
