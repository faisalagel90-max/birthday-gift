<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Arsya</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  background:#713b91;
}

/* =========================
   BACKGROUND LUAR
========================= */

.page{
  width:100vw;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:18px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at center,
      #b66bd0 0%,
      #8b4aa7 50%,
      #713b91 100%
    );
}

/* =========================
   KARTU
========================= */

.card{
  position:relative;

  width:88vw;
  max-width:620px;

  height:94vh;

  overflow:hidden;

  border-radius:30px;

  border:3px solid rgba(255,255,255,.55);

  background:
    linear-gradient(
      180deg,
      #ffd8ed 0%,
      #f8c4e1 100%
    );

  box-shadow:
    0 8px 30px rgba(0,0,0,.25);

  text-align:center;

  padding:24px 15px 15px;

  color:#fff;
}

/* =========================
   DEKORASI
========================= */

.deco{
  position:absolute;
  color:rgba(180,70,130,.18);
  pointer-events:none;
}

.deco1{
  top:10px;
  left:5px;
  font-size:45px;
}

.deco2{
  right:8px;
  bottom:10px;
  font-size:45px;
}

/* =========================
   JUDUL KECIL
========================= */

.top-title{
  font-size:15px;
  letter-spacing:5px;
  color:#a64c7d;
  margin-bottom:18px;
}

/* =========================
   HAPPY BIRTHDAY
========================= */

.title{
  font-size:58px;
  line-height:.88;
  font-weight:normal;
  color:#ffffff;

  text-shadow:
    0 2px 4px rgba(80,30,60,.15);

  margin:0;
}

/* =========================
   NAMA
========================= */

.name{
  font-size:23px;
  color:#8d467e;
  margin-top:12px;
}

/* =========================
   ANGKA 19
========================= */

.age{
  font-size:125px;
  line-height:.82;

  color:#ee9bc2;

  font-weight:normal;

  margin-top:8px;

  text-shadow:
    0 3px 10px rgba(220,100,160,.2);
}

/* =========================
   AREA KUE
========================= */

.cake-area{
  position:relative;

  width:145px;
  height:120px;

  margin:5px auto 0;

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  z-index:20;
}

.cake{
  font-size:115px;
  line-height:1;

  filter:
    drop-shadow(
      0 6px 6px rgba(0,0,0,.15)
    );

  transition:.2s;
}

.cake-area:active .cake{
  transform:scale(1.08);
}

/* =========================
   LILIN
========================= */

.candle{
  position:absolute;

  left:50%;
  top:-3px;

  transform:translateX(-50%);

  font-size:40px;

  z-index:30;

  cursor:pointer;

  transition:.3s;
}

.candle.off{
  opacity:.35;
  transform:
    translateX(-50%)
    scale(.8);
}

/* =========================
   PETUNJUK
========================= */

.instruction{
  color:#9b477d;
  font-size:13px;
  margin-top:0;
}

/* =========================
   TEKS
========================= */

.line{
  width:115px;
  height:2px;

  background:#d990b5;

  margin:7px auto;
}

.special{
  font-size:21px;
  line-height:1.05;

  color:#ffffff;

  margin-top:2px;
}

/* =========================
   KADO
========================= */

.gift-area{
  margin-top:5px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.gift{
  font-size:100px;
  line-height:.85;

  filter:
    drop-shadow(
      0 6px 6px rgba(0,0,0,.15)
    );
}

.gift-button{
  display:inline-block;

  margin-top:5px;

  padding:9px 25px;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #e94c9b,
      #9a4eb7
    );

  color:white;

  text-decoration:none;

  font-size:15px;

  font-weight:bold;

  box-shadow:
    0 4px 12px rgba(100,40,100,.2);
}

.gift-button:active{
  transform:scale(.95);
}

/* =========================
   BALON
========================= */

.balloon{
  position:absolute;

  bottom:-80px;

  width:30px;
  height:38px;

  border-radius:50% 50% 48% 48%;

  z-index:100;

  animation:
    balloonUp
    linear
    forwards;

  pointer-events:none;
}

.balloon::after{
  content:"";

  position:absolute;

  width:1px;
  height:45px;

  background:rgba(70,50,70,.55);

  left:50%;
  top:36px;
}

@keyframes balloonUp{

  0%{
    bottom:-80px;
    opacity:0;

    transform:
      translateX(0)
      rotate(0deg);
  }

  10%{
    opacity:1;
  }

  50%{
    transform:
      translateX(35px)
      rotate(8deg);
  }

  100%{
    bottom:110%;

    opacity:0;

    transform:
      translateX(-35px)
      rotate(-8deg);
  }
}

/* =========================
   LOVE PUTIH
========================= */

.love{
  position:fixed;

  bottom:-40px;

  z-index:9999;

  color:white;

  font-size:28px;

  pointer-events:none;

  animation:
    loveUp
    linear
    forwards;
}

@keyframes loveUp{

  0%{
    bottom:-40px;
    opacity:0;
    transform:scale(.5);
  }

  15%{
    opacity:1;
  }

  100%{
    bottom:110vh;
    opacity:0;

    transform:
      translateX(45px)
      scale(1.25);
  }
}

/* =========================
   HP KECIL
========================= */

@media(max-height:700px){

  .card{
    padding-top:18px;
  }

  .top-title{
    margin-bottom:10px;
    font-size:13px;
  }

  .title{
    font-size:50px;
  }

  .name{
    font-size:20px;
    margin-top:8px;
  }

  .age{
    font-size:105px;
    margin-top:5px;
  }

  .cake-area{
    height:100px;
    margin-top:2px;
  }

  .cake{
    font-size:95px;
  }

  .candle{
    font-size:34px;
  }

  .special{
    font-size:18px;
  }

  .gift{
    font-size:75px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="card" id="card">

    <div class="deco deco1">♡</div>
    <div class="deco deco2">♡</div>

    <!-- JUDUL ATAS -->
    <div class="top-title">
      ♥ A LITTLE BIRTHDAY GIFT ♥
    </div>

    <!-- HAPPY BIRTHDAY -->
    <div class="title">
      Happy<br>
      Birthday
    </div>

    <!-- NAMA -->
    <div class="name">
      Arsya Surya Sanjaya
    </div>

    <!-- UMUR -->
    <div class="age">
      19
    </div>

    <!-- KUE + LILIN -->
    <div
      class="cake-area"
      id="cakeArea"
    >

      <div
        class="candle"
        id="candle"
      >
        🕯️
      </div>

      <div class="cake">
        🎂
      </div>

    </div>

    <!-- PETUNJUK -->
    <div
      class="instruction"
      id="instruction"
    >
      Tekan lilinnya 🕯️
    </div>

    <div class="line"></div>

    <div class="special">
      Untuk seseorang yang<br>
      spesial 🤍
    </div>

    <!-- KADO -->
    <div class="gift-area">

      <div class="gift">
        🎁
      </div>

      <a
        href="public/gift.html"
        class="gift-button"
      >
        💝 Buka Hadiah
      </a>

    </div>

  </div>

</div>


<script>

/* =========================
   ELEMENT
========================= */

const candle =
  document.getElementById("candle");

const card =
  document.getElementById("card");

const instruction =
  document.getElementById("instruction");

let musicPlayed=false;


/* =========================
   HAPPY BIRTHDAY MUSIC
========================= */

function playHappyBirthday(){

  if(musicPlayed) return;

  musicPlayed=true;

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const audio =
    new AudioContext();

  const notes=[

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [352,.5],
    [330,1],

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [396,.5],
    [352,1],

    [264,.25],
    [264,.25],
    [528,.5],
    [440,.5],
    [352,.5],
    [330,.5],
    [297,1],

    [466,.25],
    [466,.25],
    [440,.5],
    [352,.5],
    [396,.5],
    [352,1]

  ];

  let time=
    audio.currentTime;

  notes.forEach(function(note){

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type="sine";

    osc.frequency.value=
      note[0];

    gain.gain.setValueAtTime(
      .001,
      time
    );

    gain.gain.exponentialRampToValueAtTime(
      .15,
      time+.03
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      time+note[1]-.03
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(time);

    osc.stop(
      time+note[1]
    );

    time+=
      note[1]+.04;

  });
}


/* =========================
   KETIKA LILIN DISENTUH
========================= */

candle.addEventListener(
  "click",
  function(){

    /* Lilin mati */

    candle.classList.add("off");

    instruction.innerHTML=
      "🎉 Happy Birthday to You! 🤍";


    /* Musik */

    playHappyBirthday();


    /* =====================
       BALON WARNA-WARNI
    ===================== */

    const balloonColors=[

      "#ff4f81",
      "#ff8c42",
      "#ffd43b",
      "#5bc0eb",
      "#7ed957",
      "#b56cff",
      "#ff69b4",
      "#ff5252"

    ];

    for(
      let i=0;
      i<28;
      i++
    ){

      const balloon=
        document.createElement("div");

      balloon.className=
        "balloon";

      balloon.style.background=
        balloonColors[
          Math.floor(
            Math.random()*
            balloonColors.length
          )
        ];

      balloon.style.left=
        (Math.random()*94)+
        "%";

      balloon.style.animationDuration=
        (3+
        Math.random()*3)+
        "s";

      balloon.style.animationDelay=
        (Math.random()*1.5)+
        "s";

      card.appendChild(balloon);

      setTimeout(
        function(){
          balloon.remove();
        },
        7500
      );
    }


    /* =====================
       LOVE PUTIH
    ===================== */

    for(
      let i=0;
      i<30;
      i++
    ){

      const love=
        document.createElement("div");

      love.className=
        "love";

      love.innerHTML=
        "🤍";

      love.style.left=
        (Math.random()*100)+
        "vw";

      love.style.animationDuration=
        (2.5+
        Math.random()*2.5)+
        "s";

      love.style.animationDelay=
        (Math.random()*1.5)+
        "s";

      document.body.appendChild(love);

      setTimeout(
        function(){
          love.remove();
        },
        6000
      );
    }

  }
);

</script>

</body>
</html>
