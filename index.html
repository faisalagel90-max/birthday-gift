
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Arsya Surya Sanjaya</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at top,#c86be2 0%,#8c35a7 45%,#54206f 100%);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
  color:#8d176d;
}

/* PANEL UTAMA */
.page{
  width:min(92vw,760px);
  min-height:100vh;
  margin:0 auto;
  padding:28px 22px 35px;
  position:relative;

  background:
    linear-gradient(
      180deg,
      #ffd9ef 0%,
      #ffc8e7 45%,
      #f6afd9 100%
    );

  border-left:3px solid rgba(255,255,255,.75);
  border-right:3px solid rgba(255,255,255,.75);
  box-shadow:
    0 0 35px rgba(255,105,210,.45),
    inset 0 0 35px rgba(255,255,255,.25);
}

/* SUDUT PANEL */
.page:before{
  content:"";
  position:absolute;
  inset:8px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:30px;
  pointer-events:none;
}

/* DEKORASI */
.decor{
  position:absolute;
  color:white;
  opacity:.85;
  font-size:35px;
  z-index:2;
}

.d1{left:-25px;top:45px;}
.d2{right:-28px;top:120px;}
.d3{left:-20px;bottom:190px;}
.d4{right:-22px;bottom:90px;}

/* PITA ATAS */
.bow{
  position:relative;
  width:190px;
  height:70px;
  margin:0 auto 5px;
  z-index:5;
}

.bow:before,
.bow:after{
  content:"";
  position:absolute;
  top:0;
  width:85px;
  height:55px;
  background:linear-gradient(135deg,#e94baf,#9b218f);
  border-radius:60% 15% 60% 15%;
  box-shadow:0 5px 12px rgba(120,20,100,.25);
}

.bow:before{
  left:5px;
  transform:rotate(-18deg);
}

.bow:after{
  right:5px;
  transform:rotate(18deg) scaleX(-1);
}

.bow-center{
  position:absolute;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  width:52px;
  height:52px;
  border-radius:50%;
  background:radial-gradient(circle,#ffb9e9,#d52a9f);
  border:3px solid white;
  box-shadow:0 4px 12px rgba(130,0,100,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

/* SUB JUDUL */
.top-title{
  text-align:center;
  font-size:18px;
  letter-spacing:7px;
  font-weight:bold;
  margin-top:5px;
  color:#a72a80;
}

/* JUDUL */
h1{
  margin:15px 0 0;
  text-align:center;
  font-size:clamp(55px,12vw,105px);
  line-height:.85;
  color:#c3228c;
  text-shadow:
    2px 3px 0 #f48bc9,
    0 5px 15px rgba(150,20,110,.25);
}

.name{
  text-align:center;
  margin-top:18px;
  font-size:clamp(25px,5vw,42px);
  font-weight:bold;
  color:#63317d;
}

/* KUE */
.cake-area{
  position:relative;
  width:100%;
  margin:25px auto 0;
  text-align:center;
}

.cake{
  position:relative;
  width:min(78vw,440px);
  height:270px;
  margin:auto;
}

/* BADAN KUE */
.cake-body{
  position:absolute;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:82%;
  height:145px;
  border-radius:25px 25px 35px 35px;
  background:
    linear-gradient(
      180deg,
      #fff8fc 0%,
      #ffc1e2 38%,
      #f486c8 39%,
      #ed5eb4 72%,
      #c53a9f 73%
    );
  box-shadow:0 12px 20px rgba(120,30,100,.2);
  border:3px solid white;
}

/* KRIM */
.cream{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:90%;
  height:52px;
  border-radius:50%;
  background:#fff8ff;
  border:3px solid white;
  box-shadow:0 5px 10px rgba(130,20,100,.15);
}

/* TABURAN */
.sprinkles{
  position:absolute;
  top:20px;
  left:0;
  width:100%;
  font-size:30px;
  letter-spacing:8px;
}

/* LILIN */
.candle{
  position:absolute;
  left:50%;
  top:-82px;
  transform:translateX(-50%);
  width:34px;
  height:90px;
  border-radius:7px;
  background:repeating-linear-gradient(
    45deg,
    #ff8ccc 0px,
    #ff8ccc 10px,
    white 10px,
    white 20px
  );
  border:2px solid #fff;
  cursor:pointer;
  z-index:10;
  box-shadow:0 3px 8px rgba(120,20,100,.2);
}

/* API */
.flame{
  position:absolute;
  top:-38px;
  left:50%;
  transform:translateX(-50%);
  width:25px;
  height:38px;
  background:#ffb300;
  border-radius:50% 50% 50% 50%;
  box-shadow:0 0 15px #ff9d00;
  animation:flicker .6s infinite alternate;
}

@keyframes flicker{
  from{transform:translateX(-50%) scale(.9);}
  to{transform:translateX(-50%) scale(1.1);}
}

.flame.off{
  display:none;
}

/* ANGKA 19 */
.number{
  text-align:center;
  font-size:clamp(100px,23vw,190px);
  line-height:.8;
  font-weight:bold;
  color:#ed65b6;
  text-shadow:
    3px 4px 0 #ffb8df,
    0 5px 12px rgba(130,20,100,.2);
  margin-top:0;
}

.instruction{
  text-align:center;
  margin-top:5px;
  font-size:20px;
  font-weight:bold;
  color:#8c3c82;
}

/* PEMISAH */
.separator{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  margin:15px 0;
}

.separator span{
  width:80px;
  height:3px;
  background:#b43b8d;
}

.separator b{
  font-size:27px;
  color:#a32679;
}

/* TEKS */
.special{
  text-align:center;
  color:white;
  font-size:clamp(22px,4.5vw,32px);
  font-weight:bold;
  text-shadow:0 2px 5px rgba(100,20,80,.3);
  margin:5px 0 10px;
}

/* KADO */
.gift{
  width:150px;
  height:125px;
  margin:0 auto 12px;
  position:relative;
  cursor:pointer;
  transition:.3s;
}

.gift:hover{
  transform:scale(1.05);
}

.gift-box{
  position:absolute;
  left:10px;
  right:10px;
  bottom:0;
  height:90px;
  background:linear-gradient(90deg,#f25ab5,#b832a0);
  border:3px solid #ffb6e2;
  border-radius:5px;
  box-shadow:0 8px 15px rgba(100,20,100,.2);
}

.gift-lid{
  position:absolute;
  left:0;
  top:22px;
  width:150px;
  height:32px;
  background:linear-gradient(90deg,#ff79c8,#c03a9f);
  border-radius:6px;
  z-index:3;
}

.ribbon-v{
  position:absolute;
  width:25px;
  height:100%;
  left:50%;
  transform:translateX(-50%);
  background:#ffd2ed;
}

.ribbon-h{
  position:absolute;
  left:0;
  top:4px;
  width:100%;
  height:23px;
  background:#ffd2ed;
  z-index:4;
}

.ribbon{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  font-size:42px;
}

/* TOMBOL */
.open{
  display:block;
  width:min(80vw,350px);
  margin:0 auto;
  padding:16px 25px;
  border-radius:40px;
  text-align:center;
  text-decoration:none;
  color:white;
  font-size:24px;
  font-weight:bold;

  background:linear-gradient(90deg,#ee3fb0,#a83ad1);

  box-shadow:
    0 8px 20px rgba(130,20,130,.35),
    inset 0 2px 2px rgba(255,255,255,.4);

  transition:.25s;
}

.open:active{
  transform:scale(.96);
}

.footer{
  text-align:center;
  margin-top:18px;
  color:#a52b7f;
  font-size:18px;
}

/* BALON */
.balloon{
  position:fixed;
  bottom:-100px;
  width:45px;
  height:58px;
  border-radius:50%;
  z-index:9999;
  animation:rise 5s linear forwards;
}

.balloon:after{
  content:"";
  position:absolute;
  width:1px;
  height:70px;
  background:#777;
  top:55px;
  left:50%;
}

@keyframes rise{
  0%{
    transform:translateY(0) rotate(0deg);
    opacity:1;
  }
  100%{
    transform:translateY(-120vh) rotate(18deg);
    opacity:0;
  }
}

/* LOVE */
.love{
  position:fixed;
  bottom:-50px;
  z-index:9998;
  font-size:35px;
  animation:loveRise 4s ease-out forwards;
  pointer-events:none;
}

@keyframes loveRise{
  0%{
    transform:translateY(0) scale(.7);
    opacity:1;
  }
  100%{
    transform:translateY(-110vh) scale(1.3);
    opacity:0;
  }
}

/* MOBILE */
@media(max-width:500px){

  .page{
    width:92vw;
    padding:20px 12px 25px;
  }

  .top-title{
    font-size:12px;
    letter-spacing:4px;
  }

  h1{
    font-size:58px;
  }

  .name{
    font-size:24px;
  }

  .cake{
    transform:scale(.88);
    transform-origin:top center;
    margin-bottom:-30px;
  }

  .number{
    font-size:120px;
  }

  .special{
    font-size:22px;
  }

  .gift{
    transform:scale(.85);
    margin-top:-5px;
    margin-bottom:-5px;
  }

  .open{
    font-size:20px;
    padding:14px 20px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="decor d1">♡</div>
  <div class="decor d2">✦</div>
  <div class="decor d3">♡</div>
  <div class="decor d4">✦</div>

  <div class="bow">
    <div class="bow-center">♥</div>
  </div>

  <div class="top-title">
    ♥ A LITTLE BIRTHDAY GIFT ♥
  </div>

  <h1>
    Happy<br>
    Birthday
  </h1>

  <div class="name">
    Arsya Surya Sanjaya
  </div>

  <div class="cake-area">

    <div class="cake">

      <div
        class="candle"
        id="candle"
        onclick="blowCandle()"
        title="Tekan lilinnya"
      >
        <div class="flame" id="flame"></div>
      </div>

      <div class="cake-body">
        <div class="cream"></div>

        <div class="sprinkles">
          🍓 🩷 🍓 🩷 🍓
        </div>
      </div>

    </div>

  </div>

  <div class="number">
    19
  </div>

  <div class="instruction">
    Tekan lilinnya 🕯️
  </div>

  <div class="separator">
    <span></span>
    <b>♥</b>
    <span></span>
  </div>

  <div class="special">
    Untuk seseorang yang<br>
    spesial 🤍
  </div>

  <!-- KADO -->
  <div class="gift">

    <div class="gift-lid">
      <div class="ribbon-h"></div>
    </div>

    <div class="gift-box">
      <div class="ribbon-v"></div>
    </div>

    <div class="ribbon">
      🎀
    </div>

  </div>

  <!-- MENUJU VIDEO -->
  <a class="open" href="public/gift.html">
    🎁 &nbsp; Buka Hadiah
  </a>

  <div class="footer">
    Ada sesuatu yang spesial untukmu ♥
  </div>

</div>

<script>

let candlePressed = false;

function blowCandle(){

  if(candlePressed) return;

  candlePressed = true;

  // Matikan api
  document.getElementById("flame").classList.add("off");

  // BALON
  const balloonColors=[
    "#ff4fa3",
    "#b85cff",
    "#ff8ad8",
    "#8e63ff",
    "#ff5d7d",
    "#d86cff"
  ];

  for(let i=0;i<18;i++){

    setTimeout(function(){

      const balloon=document.createElement("div");

      balloon.className="balloon";

      balloon.style.left=(Math.random()*90+3)+"%";

      balloon.style.background=
        balloonColors[
          Math.floor(Math.random()*balloonColors.length)
        ];

      balloon.style.animationDuration=
        (4+Math.random()*3)+"s";

      document.body.appendChild(balloon);

      setTimeout(()=>{
        balloon.remove();
      },7500);

    },i*120);

  }

  // LOVE PUTIH
  for(let i=0;i<15;i++){

    setTimeout(function(){

      const love=document.createElement("div");

      love.className="love";
      love.innerHTML="🤍";

      love.style.left=(Math.random()*90+3)+"%";

      love.style.animationDuration=
        (3+Math.random()*2)+"s";

      document.body.appendChild(love);

      setTimeout(()=>{
        love.remove();
      },6000);

    },i*160);

  }

  // efek tambahan
  for(let i=0;i<20;i++){

    setTimeout(function(){

      const spark=document.createElement("div");

      spark.innerHTML="✦";
      spark.style.position="fixed";
      spark.style.left=(Math.random()*100)+"%";
      spark.style.bottom="-30px";
      spark.style.fontSize="25px";
      spark.style.color="#fff";
      spark.style.zIndex="9999";
      spark.style.pointerEvents="none";
      spark.style.transition="4s ease-out";

      document.body.appendChild(spark);

      setTimeout(()=>{
        spark.style.transform=
          "translateY(-100vh) rotate(360deg)";
        spark.style.opacity="0";
      },50);

      setTimeout(()=>{
        spark.remove();
      },4500);

    },i*100);

  }

}

</script>

</body>
</html>
