<!-- BIRTHDAY SCENE -->
<div id="birthdayScene">

  <div class="birthday-title">
    <div class="special-day">Happy Special Day</div>
    <div class="birthday-name">Arsya Surya Sanjaya</div>
  </div>

  <div class="cake-area" id="cakeArea">
    <div class="candle" id="candle">🕯️</div>
    <div class="cake">🎂</div>
  </div>

  <div id="instruction">
    Tekan lilinnya 🕯️
  </div>

  <div class="gift-area">
    <div class="gift-icon">🎁</div>

    <a href="public/gift.html" class="gift-button">
      Buka Hadiah
    </a>

    <div class="gift-text">
      Ada sesuatu untukmu 💗
    </div>
  </div>

</div>

<style>
#birthdayScene {
  text-align: center;
  position: relative;
  overflow: hidden;
  padding: 30px 10px 45px;
  min-height: 650px;
  background: linear-gradient(
    180deg,
    #fff0fa 0%,
    #f8e8ff 50%,
    #eadcff 100%
  );
  border-radius: 30px;
}

/* JUDUL */
.special-day {
  font-size: 44px;
  font-weight: 900;
  color: #e83e9f;
  line-height: 1.1;
  text-shadow:
    0 3px 8px rgba(232, 62, 159, .25);
}

.birthday-name {
  font-size: 25px;
  font-weight: 700;
  color: #7b3fa1;
  margin-top: 10px;
}

/* AREA KUE */
.cake-area {
  position: relative;
  display: inline-block;
  margin-top: 35px;
  padding: 30px;
  cursor: pointer;
  z-index: 5;
}

.cake {
  font-size: 175px;
  line-height: 1;
  filter:
    drop-shadow(0 8px 10px rgba(123,63,161,.25));
  transition: transform .2s;
}

.cake-area:active .cake {
  transform: scale(1.08);
}

/* LILIN */
.candle {
  position: absolute;
  z-index: 10;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 55px;
  cursor: pointer;
}

.candle:active {
  transform: translateX(-50%) scale(1.2);
}

#instruction {
  color: #8e3fb0;
  font-weight: bold;
  font-size: 17px;
}

/* HADIAH */
.gift-area {
  margin-top: 35px;
}

.gift-icon {
  font-size: 60px;
}

.gift-button {
  display: inline-block;
  margin-top: 8px;
  padding: 15px 34px;
  border-radius: 30px;
  background: linear-gradient(
    135deg,
    #ec62ae,
    #9147c7
  );
  color: white;
  text-decoration: none;
  font-size: 19px;
  font-weight: bold;
  box-shadow:
    0 6px 18px rgba(145,71,199,.3);
}

.gift-button:active {
  transform: scale(.96);
}

.gift-text {
  margin-top: 8px;
  color: #7b3fa1;
}

/* BALON */
.flying-balloon {
  position: absolute;
  bottom: -100px;
  font-size: 48px;
  z-index: 20;
  pointer-events: none;
  animation: balloonUp linear forwards;
}

@keyframes balloonUp {
  0% {
    bottom: -100px;
    opacity: 0;
    transform: translateX(0) rotate(0deg);
  }

  10% {
    opacity: 1;
  }

  50% {
    transform: translateX(45px) rotate(10deg);
  }

  100% {
    bottom: 110%;
    opacity: 0;
    transform: translateX(-45px) rotate(-10deg);
  }
}

/* HATI PUTIH */
.flying-heart {
  position: fixed;
  bottom: -40px;
  font-size: 30px;
  z-index: 9999;
  pointer-events: none;
  animation: heartUp linear forwards;
}

@keyframes heartUp {
  0% {
    bottom: -40px;
    opacity: 0;
    transform: scale(.7);
  }

  100% {
    bottom: 110vh;
    opacity: 0;
    transform:
      translateX(40px)
      scale(1.3);
  }
}
    </style>


<script>
const candle = document.getElementById("candle");
const birthdayScene = document.getElementById("birthdayScene");
const instruction = document.getElementById("instruction");

let birthdayStarted = false;

/* MUSIK HAPPY BIRTHDAY TO YOU */
function playHappyBirthday() {

  if (birthdayStarted) return;
  birthdayStarted = true;

  const AudioContext =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContext) return;

  const audio = new AudioContext();

  /*
   * Melodi Happy Birthday:
   * Happy birthday to you...
   */
  const notes = [
    [264,.25],[264,.25],[297,.5],[264,.5],
    [352,.5],[330,1],

    [264,.25],[264,.25],[297,.5],[264,.5],
    [396,.5],[352,1],

    [264,.25],[264,.25],[528,.5],[440,.5],
    [352,.5],[330,.5],[297,1],

    [466,.25],[466,.25],[440,.5],[352,.5],
    [396,.5],[352,1]
  ];

  let startTime = audio.currentTime;

  notes.forEach(function(note) {

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = note[0];

    gain.gain.setValueAtTime(.001, startTime);
    gain.gain.exponentialRampToValueAtTime(
      .18,
      startTime + .03
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      startTime + note[1] - .03
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);

    oscillator.start(startTime);
    oscillator.stop(startTime + note[1]);

    startTime += note[1] + .04;
  });
}

/* KETIKA LILIN DITEKAN */
candle.addEventListener("click", function(event) {

  event.stopPropagation();

  instruction.innerHTML =
    "🎉 Happy Birthday to You! 🤍🎈";

  /* Putar musik */
  playHappyBirthday();

  /* Balon */
  const balloons = [
    "🎈","🎈","🎈","🎈","🎈",
    "🎈","🎈","🎈","🎈","🎈",
    "🎈","🎈","🎈","🎈","🎈",
    "🎈","🎈","🎈","🎈","🎈"
  ];

  balloons.forEach(function(symbol, index) {

    const balloon = document.createElement("div");

    balloon.className = "flying-balloon";
    balloon.innerHTML = symbol;

    balloon.style.left =
      (Math.random() * 92) + "%";

    balloon.style.animationDuration =
      (3 + Math.random() * 3) + "s";

    balloon.style.animationDelay =
      (index * .12) + "s";

    birthdayScene.appendChild(balloon);

    setTimeout(function() {
      balloon.remove();
    }, 7000);
  });

  /* HATI PUTIH 🤍 */
  for (let i = 0; i < 25; i++) {

    const heart = document.createElement("div");

    heart.className = "flying-heart";
    heart.innerHTML = "🤍";

    heart.style.left =
      (Math.random() * 100) + "vw";

    heart.style.animationDuration =
      (2.5 + Math.random() * 2) + "s";

    heart.style.animationDelay =
      (Math.random() * 1.5) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {
      heart.remove();
    }, 5000);
  }

});
</script>
</body>
</html>
