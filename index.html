<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Arsya Surya Sanjaya</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #8d3ca5;
}

.page {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: auto;
  line-height: 0;
}

.design {
  display: block;
  width: 100%;
  height: auto;
}

.hotspot {
  position: absolute;
  display: block;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Area lilin pada gambar */
.candle {
  left: 43%;
  top: 49%;
  width: 15%;
  height: 13%;
}

/* Area tombol Buka Hadiah pada bagian bawah */
.gift {
  left: 15%;
  top: 82%;
  width: 70%;
  height: 12%;
}

.message {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255,255,255,.95);
  color: #9d267e;
  padding: 12px 22px;
  border-radius: 30px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 20;
  box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.message.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="page">

  <img
    class="design"
    src="public/birthday-design.jpg"
    alt="Happy Birthday Arsya Surya Sanjaya"
  >

  <button
    class="hotspot candle"
    aria-label="Tekan lilin"
    onclick="tekanLilin()">
  </button>

  <a
    class="hotspot gift"
    href="public/gift.html"
    aria-label="Buka hadiah">
  </a>

</div>

<div id="message" class="message">
  🎂 Lilinnya sudah ditekan 💗
</div>

<script>
let sudahDitekan = false;

function tekanLilin() {

    if (sudahDitekan) return;
    sudahDitekan = true;

    const message = document.getElementById("message");
    message.classList.add("show");

    /* 🎈 BALON */
    for (let i = 0; i < 18; i++) {

        const balon = document.createElement("div");

        balon.innerHTML = "🎈";

        balon.style.position = "fixed";
        balon.style.left = Math.random() * 100 + "vw";
        balon.style.bottom = "-60px";
        balon.style.fontSize = (25 + Math.random() * 25) + "px";
        balon.style.zIndex = "9999";
        balon.style.pointerEvents = "none";
        balon.style.animation =
            "naikBalon " +
            (4 + Math.random() * 3) +
            "s linear forwards";

        document.body.appendChild(balon);

        setTimeout(() => {
            balon.remove();
        }, 7500);
    }

    /* 🤍 HATI */
    for (let i = 0; i < 25; i++) {

        const hati = document.createElement("div");

        hati.innerHTML = "🤍";

        hati.style.position = "fixed";
        hati.style.left = Math.random() * 100 + "vw";
        hati.style.bottom = "-30px";
        hati.style.fontSize = (18 + Math.random() * 20) + "px";
        hati.style.zIndex = "10000";
        hati.style.pointerEvents = "none";
        hati.style.animation =
            "naikHati " +
            (3 + Math.random() * 3) +
            "s linear forwards";

        document.body.appendChild(hati);

        setTimeout(() => {
            hati.remove();
        }, 6500);
    }

    /* 🎵 MUSIK HAPPY BIRTHDAY */
    mainkanHappyBirthday();
}


/* 🎈 ANIMASI BALON */
const style = document.createElement("style");

style.innerHTML = `
@keyframes naikBalon {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
    }
}

@keyframes naikHati {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) translateX(40px) scale(1.5);
        opacity: 0;
    }
}
`;

document.head.appendChild(style);


/* 🎵 HAPPY BIRTHDAY */
function mainkanHappyBirthday() {

    const lagu = new Audio(
        "public/Jamrud%20-%20Selamat%20Ulang%20Tahun%20-%20potong%207%20detik.mp3"
    );

    lagu.volume = 1.0;
    lagu.currentTime = 0;

    lagu.play().catch(error => {
        console.log("Musik tidak dapat diputar:", error);
    });
}
</script>
</body>
</html>
