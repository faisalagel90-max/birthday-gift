<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy Birthday Arsya Surya Sanjaya</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Georgia,serif;
}

body{
  background:linear-gradient(135deg,#7b2b91,#c45bd3,#8c3fa5);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#8d176d;
}

/* KARTU UTAMA */
.card{
  position:relative;
  width:92vw;
  height:96vh;
  max-width:620px;
  background:linear-gradient(180deg,#ffd4ec,#f7afd8);
  border:3px solid rgba(255,255,255,.8);
  border-radius:30px;
  box-shadow:
    0 0 25px rgba(255,255,255,.55),
    inset 0 0 20px rgba(255,255,255,.35);
  text-align:center;
  overflow:hidden;
  padding:18px 18px;
}

/* DEKORASI */
.sparkle{
  position:absolute;
  color:white;
  font-size:24px;
  opacity:.85;
}

.s1{top:45px;left:20px;}
.s2{top:80px;right:22px;}
.s3{bottom:45px;left:25px;}
.s4{bottom:75px;right:20px;}

.top{
  font-size:13px;
  letter-spacing:7px;
  margin-top:5px;
  color:#8d176d;
  font-weight:bold;
}

/* PITA */
.ribbon{
  font-size:55px;
  line-height:45px;
  margin-top:-3px;
}

/* JUDUL */
h1{
  margin:4px 0 0;
  font-size:clamp(43px,11vw,72px);
  line-height:.88;
  color:#c51f82;
  text-shadow:
    2px 3px 0 #fff,
    0 5px 10px rgba(120,0,80,.18);
}

.name{
  margin-top:12px;
  font-size:clamp(19px,5vw,30px);
  font-weight:bold;
  color:#64256f;
}

/* KUE */
.cake-area{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.cake{
  position:relative;
  width:min(280px,55vw);
  height:min(155px,30vw);
  margin-top:42px;
  background:linear-gradient(#fff4ff 0 25%,#ffb5dd 26% 72%,#e98ac7 73%);
  border-radius:18px 18px 35px 35px;
  box-shadow:
    inset 0 -12px 0 rgba(170,60,150,.15),
    0 10px 15px rgba(130,40,120,.2);
  cursor:pointer;
}

/* KRIM */
.cake:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:28px;
  height:25px;
  background:
    radial-gradient(circle at 10px 0,#fff 12px,transparent 13px)
    repeat-x;
  background-size:38px 30px;
}

/* Hiasan */
.cake:after{
  content:"♥  ♥  ♥  ♥  ♥";
  position:absolute;
  left:0;
  right:0;
  bottom:25px;
  color:#d52a9b;
  font-size:19px;
  letter-spacing:10px;
}

/* LILIN */
.candle{
  position:absolute;
  left:50%;
  top:-58px;
  transform:translateX(-50%);
  width:23px;
  height:63px;
  border-radius:5px;
  background:repeating-linear-gradient(
    -45deg,
    #ff66bb 0 8px,
    #fff 8px 15px
  );
  cursor:pointer;
  z-index:5;
}

.flame{
  position:absolute;
  left:50%;
  top:-27px;
  transform:translateX(-50%);
  width:20px;
  height:29px;
  background:#ffb21c;
  border-radius:50% 50% 50% 50%;
  box-shadow:0 0 15px #ff8c00;
  animation:flicker .35s infinite alternate;
}

.flame:after{
  content:"";
  position:absolute;
  width:8px;
  height:13px;
  background:#fff7a8;
  border-radius:50%;
  left:6px;
  top:8px;
}

.flame.off{
  display:none;
}

@keyframes flicker{
  from{transform:translateX(-50%) scale(1);}
  to{transform:translateX(-50%) scale(1.12);}
}

/* ANGKA 19 */
.age{
  margin-top:5px;
  font-size:clamp(65px,17vw,110px);
  line-height:.8;
  color:#ef72b8;
  font-weight:bold;
  text-shadow:
    2px 3px 0 white,
    0 5px 10px rgba(150,30,110,.2);
}

.instruction{
  margin-top:5px;
  font-size:14px;
  color:#77306e;
  font-weight:bold;
}

/* PEMBATAS */
.divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:8px auto;
  color:#a51b78;
}

.divider span{
  width:65px;
  height:2px;
  background:#c75b9e;
}

.special{
  font-size:17px;
  color:white;
  font-weight:bold;
  text-shadow:0 2px 4px rgba(100,0,70,.2);
}

/* KADO */
.gift{
  font-size:clamp(65px,18vw,105px);
  line-height:.85;
  margin-top:3px;
  filter:drop-shadow(0 8px 8px rgba(100,0,80,.18));
}

/* TOMBOL */
.button{
  display:inline-block;
  margin-top:7px;
  padding:12px 28px;
  border-radius:30px;
  background:linear-gradient(90deg,#ec38a7,#a932d0);
  color:white;
  text-decoration:none;
  font-size:19px;
  font-weight:bold;
  box-shadow:
    0 7px 15px rgba(130,20,130,.25),
    inset 0 1px 2px rgba(255,255,255,.5);
}

.small{
  margin-top:6px;
  font-size:12px;
  color:#8d176d;
  font-weight:bold;
}

/* BALON & LOVE */
.floating{
  position:fixed;
  bottom:-80px;
  z-index:100;
  pointer-events:none;
  animation:rise 5s linear forwards;
}

.balloon{
  font-size:42px;
}

.love{
  font-size:32px;
  color:white;
  text-shadow:0 2px 8px rgba(255,255,255,.7);
}

@keyframes rise{
  0%{
    transform:translateY(0) translateX(0) rotate(0);
    opacity:0;
  }
  10%{opacity:1;}
  100%{
    transform:translateY(-115vh) translateX(var(--move)) rotate(15deg);
    opacity:0;
  }
}

/* UNTUK HP KECIL */
@media(max-height:700px){
  .card{
    height:94vh;
    padding-top:12px;
  }

  .top{
    font-size:10px;
  }

  .ribbon{
    font-size:42px;
  }

  h1{
    font-size:43px;
  }

  .name{
    font-size:18px;
    margin-top:8px;
  }

  .cake{
    width:210px;
    height:115px;
    margin-top:35px;
  }

  .age{
    font-size:70px;
  }

  .special{
    font-size:14px;
  }

  .gift{
    font-size:65px;
  }

  .button{
    font-size:16px;
    padding:10px 23px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="sparkle s1">♡</div>
  <div class="sparkle s2">✦</div>
  <div class="sparkle s3">♡</div>
  <div class="sparkle s4">✦</div>

  <div class="top">♥ A LITTLE BIRTHDAY GIFT ♥</div>

  <div class="ribbon">🎀</div>

  <h1>Happy<br>Birthday</h1>

  <div class="name">
    Arsya Surya Sanjaya
  </div>

  <div class="cake-area">

    <div class="cake" id="cake">

      <div class="candle" id="candle">
        <div class="flame" id="flame"></div>
      </div>

    </div>

    <div class="age">19</div>

    <div class="instruction">
      Tekan lilinnya 🕯️
    </div>

  </div>

  <div class="divider">
    <span></span>
    ♥
    <span></span>
  </div>

  <div class="special">
    Untuk seseorang yang spesial 🤍
  </div>

  <div class="gift">🎁</div>

  <a class="button" href="public/gift.html">
    🎁 &nbsp; Buka Hadiah
  </a>

  <div class="small">
    Ada sesuatu yang spesial untukmu ♥
  </div>

</div>

<script>

/* =========================
   MUSIK HAPPY BIRTHDAY
========================= */

let musicStarted = false;

function playBirthdayMusic(){

  if(musicStarted) return;

  musicStarted = true;

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext) return;

  const ctx = new AudioContext();

  const notes = [
    264,264,297,264,352,330,
    264,264,297,264,396,352,
    264,264,528,440,352,330,297,
    466,466,440,352,396,352
  ];

  let time = ctx.currentTime;

  notes.forEach((freq,i)=>{

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(.0001,time);
    gain.gain.exponentialRampToValueAtTime(.18,time+.03);
    gain.gain.exponentialRampToValueAtTime(.0001,time+.42);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(time);
    osc.stop(time+.45);

    time += .45;
  });
}


/* =========================
   BALON
========================= */

function createBalloon(){

  const item = document.createElement("div");

  item.className = "floating balloon";

  const balloons = [
    "🎈","🎈","🎈","🎈","🎈"
  ];

  item.textContent =
    balloons[Math.floor(Math.random()*balloons.length)];

  item.style.left =
    Math.random()*100 + "vw";

  item.style.setProperty(
    "--move",
    (Math.random()*180-90) + "px"
  );

  item.style.animationDuration =
    (4 + Math.random()*3) + "s";

  document.body.appendChild(item);

  setTimeout(()=>{
    item.remove();
  },7000);
}


/* =========================
   LOVE PUTIH
========================= */

function createLove(){

  const item = document.createElement("div");

  item.className = "floating love";
  item.textContent = "🤍";

  item.style.left =
    Math.random()*100 + "vw";

  item.style.setProperty(
    "--move",
    (Math.random()*180-90) + "px"
  );

  item.style.animationDuration =
    (4 + Math.random()*3) + "s";

  document.body.appendChild(item);

  setTimeout(()=>{
    item.remove();
  },7000);
}


/* =========================
   KETIKA LILIN DITEKAN
========================= */

document.getElementById("candle").addEventListener("click",function(e){

  e.stopPropagation();

  /* matikan api */
  document.getElementById("flame")
    .classList.add("off");

  /* musik */
  playBirthdayMusic();

  /* balon */
  for(let i=0;i<14;i++){

    setTimeout(()=>{
      createBalloon();
    },i*180);

  }

  /* love putih */
  for(let i=0;i<12;i++){

    setTimeout(()=>{
      createLove();
    },i*230);

  }

});

</script>

</body>
</html>
