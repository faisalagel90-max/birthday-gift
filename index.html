<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Arsya</title>

<style>

/* =========================
   DASAR HALAMAN
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #663c51 0%,
      #4c293c 60%,
      #351c2c 100%
    );

  font-family:
    Georgia,
    "Times New Roman",
    serif;
}


/* =========================
   HALAMAN
========================= */

.page {
  width: 100vw;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}


/* =========================
   KARTU
========================= */

.card {

  position: relative;

  width: min(88vw, 610px);
  height: 94vh;

  overflow: hidden;

  border-radius: 32px;

  border: 3px solid rgba(255,255,255,.22);

  background:
    linear-gradient(
      180deg,
      #5b3448 0%,
      #583247 100%
    );

  box-shadow:
    0 10px 35px rgba(0,0,0,.25);

  text-align: center;

  color: white;

  padding:
    42px
    30px
    25px;

}


/* =========================
   DEKORASI
========================= */

.decor {
  position: absolute;

  color: rgba(238,150,193,.18);

  font-size: 45px;

  pointer-events: none;
}

.decor.one {
  left: 8px;
  top: -5px;
}

.decor.two {
  right: 10px;
  bottom: 15px;
}

.decor.three {
  right: 25px;
  top: 100px;
  font-size: 25px;
}


/* =========================
   JUDUL ATAS
========================= */

.small-title {

  font-size: 17px;

  letter-spacing: 6px;

  color: #e8a5c2;

  margin-bottom: 35px;

  white-space: nowrap;
}


/* =========================
   HAPPY BIRTHDAY
========================= */

.main-title {

  font-size:
    clamp(58px, 14vw, 95px);

  line-height: .83;

  font-weight: normal;

  color: #ffffff;

  margin: 0;

  text-shadow:
    0 3px 5px rgba(0,0,0,.12);
}


/* =========================
   NAMA
========================= */

.name {

  font-size:
    clamp(20px, 5vw, 31px);

  color: #ffffff;

  margin-top: 15px;

  line-height: 1.1;
}


/* =========================
   ANGKA 19
========================= */

.age {

  font-size:
    clamp(105px, 28vw, 175px);

  line-height: .85;

  color: #ef9bc2;

  font-weight: normal;

  margin-top: 10px;

  text-shadow:
    0 4px 12px rgba(239,155,194,.22);
}


/* =========================
   KUE
   UKURAN MIRIP ANGKA 19
========================= */

.cake-area {

  position: relative;

  width:
    clamp(120px, 32vw, 175px);

  height:
    clamp(105px, 27vw, 155px);

  margin:
    4px auto 0;

  display: flex;

  justify-content: center;

  align-items: center;

  cursor: pointer;

  z-index: 20;
}


.cake {

  font-size:
    clamp(95px, 25vw, 150px);

  line-height: 1;

  transition:
    transform .2s ease;

  filter:
    drop-shadow(
      0 7px 8px rgba(0,0,0,.18)
    );
}


.cake-area:active .cake {

  transform:
    scale(1.08);
}


/* =========================
   LILIN
========================= */

.candle {

  position: absolute;

  z-index: 30;

  left: 50%;

  top: -3px;

  transform:
    translateX(-50%);

  font-size:
    clamp(35px, 10vw, 52px);

  cursor: pointer;

  transition:
    opacity .3s ease,
    transform .2s ease;
}


.candle.off {

  opacity: .25;

  transform:
    translateX(-50%)
    scale(.8);
}


.instruction {

  font-size: 14px;

  color: #e8a5c2;

  margin-top: 2px;
}


/* =========================
   GARIS
========================= */

.line {

  width: 150px;

  height: 2px;

  background: #e8a5c2;

  margin:
    12px auto 10px;
}


/* =========================
   TEKS CONTOH
========================= */

.special {

  font-size:
    clamp(20px, 5vw, 30px);

  line-height: 1.1;

  margin-top: 2px;

  color: white;
}


/* =========================
   KADO
========================= */

.gift-area {

  margin-top: 5px;

  display: flex;

  flex-direction: column;

  align-items: center;
}


.gift {

  font-size:
    clamp(75px, 20vw, 120px);

  line-height: .9;

  filter:
    drop-shadow(
      0 6px 7px rgba(0,0,0,.18)
    );
}


.gift-button {

  display: inline-block;

  margin-top: 4px;

  padding:
    9px 23px;

  border-radius: 25px;

  background:
    linear-gradient(
      135deg,
      #ef9bc2,
      #c56fa2
    );

  color: white;

  text-decoration: none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 15px;

  box-shadow:
    0 4px 10px rgba(0,0,0,.18);
}


.gift-button:active {

  transform:
    scale(.96);
}


/* =========================
   BALON
========================= */

.balloon {

  position: absolute;

  bottom: -80px;

  font-size: 40px;

  z-index: 50;

  pointer-events: none;

  animation:
    balloonFly
    linear
    forwards;
}


@keyframes balloonFly {

  0% {

    bottom: -80px;

    opacity: 0;

    transform:
      translateX(0)
      rotate(0deg);
  }

  12% {

    opacity: 1;
  }

  50% {

    transform:
      translateX(45px)
      rotate(8deg);
  }

  100% {

    bottom: 110%;

    opacity: 0;

    transform:
      translateX(-45px)
      rotate(-8deg);
  }
}


/* =========================
   LOVE PUTIH
========================= */

.love {

  position: fixed;

  bottom: -30px;

  z-index: 999;

  font-size: 28px;

  pointer-events: none;

  animation:
    loveFly
    linear
    forwards;
}


@keyframes loveFly {

  0% {

    bottom: -30px;

    opacity: 0;

    transform:
      scale(.6);
  }

  15% {

    opacity: 1;
  }

  100% {

    bottom: 110vh;

    opacity: 0;

    transform:
      translateX(45px)
      scale(1.3);
  }
}


/* =========================
   HP KECIL
========================= */

@media (max-height: 700px) {

  .card {

    padding-top: 25px;
    padding-bottom: 15px;
  }

  .small-title {

    margin-bottom: 18px;

    font-size: 14px;
  }

  .name {

    margin-top: 8px;
  }

  .age {

    margin-top: 4px;
  }

  .cake-area {

    margin-top: 0;
  }

  .line {

    margin-top: 5px;
  }

  .gift-area {

    margin-top: 0;
  }

}


/* HP SANGAT KECIL */

@media (max-height: 600px) {

  .small-title {
    margin-bottom: 8px;
  }

  .special {
    font-size: 18px;
  }

  .instruction {
    font-size: 11px;
  }

}

</style>
</head>


<body>

<div class="page">

  <div class="card">

    <!-- dekorasi -->
    <div class="decor one">♡</div>
    <div class="decor two">♡</div>
    <div class="decor three">✦</div>


    <!-- tulisan asli -->
    <div class="small-title">
      A LITTLE BIRTHDAY GIFT
    </div>


    <div class="main-title">
      Happy<br>
      Birthday
    </div>


    <!-- NAMA BARU -->
    <div class="name">
      Arsya Surya Sanjaya
    </div>


    <!-- USIA -->
    <div class="age">
      19
    </div>


    <!-- KUE -->
    <div
      class="cake-area"
      id="cakeArea"
    >

      <div
        class="candle"
        id="candle"
      >
        🕯️
      </div>

      <div class="cake">
        🎂
      </div>

    </div>


    <div
      class="instruction"
      id="instruction"
    >
      Tekan lilinnya 🕯️
    </div>


    <!-- tulisan dari contoh -->
    <div class="special">
      Untuk seseorang yang<br>
      spesial 🤍
    </div>


    <div class="line"></div>


    <!-- KADO -->
    <div class="gift-area">

      <div class="gift">
        🎁
      </div>

      <a
        href="public/gift.html"
        class="gift-button"
      >
        💝 Buka Hadiah
      </a>

    </div>

  </div>

</div>


<script>

/* ==================================
   KUE & LILIN
================================== */

const candle =
  document.getElementById("candle");

const cakeArea =
  document.getElementById("cakeArea");

const card =
  document.querySelector(".card");

const instruction =
  document.getElementById("instruction");


let birthdayPlayed = false;


/* ==================================
   MUSIK HAPPY BIRTHDAY
================================== */

function playHappyBirthday() {

  if (birthdayPlayed) return;

  birthdayPlayed = true;


  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) return;


  const audio =
    new AudioContext();


  /*
   * Melodi:
   * Happy Birthday To You
   */

  const notes = [

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [352,.5],
    [330,1],

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [396,.5],
    [352,1],

    [264,.25],
    [264,.25],
    [528,.5],
    [440,.5],
    [352,.5],
    [330,.5],
    [297,1],

    [466,.25],
    [466,.25],
    [440,.5],
    [352,.5],
    [396,.5],
    [352,1]

  ];


  let time =
    audio.currentTime;


  notes.forEach(
    function(note) {

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        note[0];


      gain.gain.setValueAtTime(
        .001,
        time
      );


      gain.gain.exponentialRampToValueAtTime(
        .15,
        time + .03
      );


      gain.gain.exponentialRampToValueAtTime(
        .001,
        time + note[1] - .03
      );


      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );


      oscillator.start(time);

      oscillator.stop(
        time + note[1]
      );


      time +=
        note[1] + .04;

    }
  );

}


/* ==================================
   LILIN DITEKAN
================================== */

candle.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    /* Lilin mati */

    candle.classList.add("off");


    instruction.innerHTML =
      "🎉 Happy Birthday to You! 🤍";


    /* Musik */

    playHappyBirthday();


    /* ==================================
       BALON WARNA-WARNI
    ================================== */

    const colors = [
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈"
    ];


    for (
      let i = 0;
      i < 25;
      i++
    ) {

      const balloon =
        document.createElement("div");


      balloon.className =
        "balloon";


      balloon.innerHTML =
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ];


      balloon.style.left =
        (Math.random() * 95) + "%";


      balloon.style.animationDuration =
        (3 + Math.random() * 3) + "s";


      balloon.style.animationDelay =
        (Math.random() * 1.5) + "s";


      card.appendChild(
        balloon
      );


      setTimeout(
        function() {

          balloon.remove();

        },
        7500
      );

    }


    /* ==================================
       LOVE PUTIH 🤍
    ================================== */

    for (
      let i = 0;
      i < 30;
      i++
    ) {

      const love =
        document.createElement("div");


      love.className =
        "love";


      love.innerHTML =
        "🤍";


      love.style.left =
        (Math.random() * 100) + "vw";


      love.style.animationDuration =
        (2.5 + Math.random() * 2.5) + "s";


      love.style.animationDelay =
        (Math.random() * 1.5) + "s";


      document.body.appendChild(
        love
      );


      setTimeout(
        function() {

          love.remove();

        },
        5500
      );

    }

  }
);

</script>

</body>
</html>
</body>
</html>
