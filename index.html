<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Arsya Surya Sanjaya</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #8d3ca5;
}

.page {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: auto;
  line-height: 0;
}

.design {
  display: block;
  width: 100%;
  height: auto;
}

.hotspot {
  position: absolute;
  display: block;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Area lilin pada gambar */
.candle {
  left: 43%;
  top: 49%;
  width: 15%;
  height: 13%;
}

/* Area tombol Buka Hadiah pada bagian bawah */
.gift {
  left: 15%;
  top: 82%;
  width: 70%;
  height: 12%;
}

.message {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255,255,255,.95);
  color: #9d267e;
  padding: 12px 22px;
  border-radius: 30px;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  opacity: 0;
  pointer-events: none;
  transition: .3s;
  z-index: 20;
  box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

.message.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="page">

  <img
    class="design"
    src="public/birthday-design.jpg"
    alt="Happy Birthday Arsya Surya Sanjaya"
  >

  <button
    class="hotspot candle"
    aria-label="Tekan lilin"
    onclick="tekanLilin()">
  </button>

  <a
    class="hotspot gift"
    href="public/gift.html"
    aria-label="Buka hadiah">
  </a>

</div>

<div id="message" class="message">
  🎂 Lilinnya sudah ditekan 💗
</div>

<script>
function tekanLilin() {
  const message = document.getElementById("message");
  message.classList.add("show");

  setTimeout(() => {
    message.classList.remove("show");
  }, 2500);
}
</script>

</body>
</html>
