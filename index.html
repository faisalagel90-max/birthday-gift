<script>

/* =========================
   MUSIK HAPPY BIRTHDAY
========================= */

const candle =
  document.getElementById("candle");

const birthdayScene =
  document.getElementById("birthdayScene");

const instruction =
  document.getElementById("instruction");

let birthdayStarted = false;


function playHappyBirthday() {

  if (birthdayStarted) return;

  birthdayStarted = true;

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) return;

  const audio =
    new AudioContext();


  /*
    Happy Birthday To You
  */

  const notes = [

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [352,.5],
    [330,1],

    [264,.25],
    [264,.25],
    [297,.5],
    [264,.5],
    [396,.5],
    [352,1],

    [264,.25],
    [264,.25],
    [528,.5],
    [440,.5],
    [352,.5],
    [330,.5],
    [297,1],

    [466,.25],
    [466,.25],
    [440,.5],
    [352,.5],
    [396,.5],
    [352,1]

  ];


  let time =
    audio.currentTime;


  notes.forEach(function(note) {

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();


    oscillator.type =
      "sine";

    oscillator.frequency.value =
      note[0];


    gain.gain.setValueAtTime(
      .001,
      time
    );


    gain.gain.exponentialRampToValueAtTime(
      .16,
      time + .03
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      time + note[1] - .03
    );


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.start(time);

    oscillator.stop(
      time + note[1]
    );


    time +=
      note[1] + .04;

  });

}


/* =========================
   KETIKA LILIN DITEKAN
========================= */

candle.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    instruction.innerHTML =
      "🎉 Happy Birthday to You! 🤍";


    /* Musik */

    playHappyBirthday();


    /* =====================
       BALON
    ===================== */

    const balloons = [

      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈",
      "🎈"

    ];


    balloons.forEach(
      function(symbol,index) {

        const balloon =
          document.createElement("div");


        balloon.className =
          "flying-balloon";


        balloon.innerHTML =
          symbol;


        balloon.style.left =
          (Math.random() * 92) + "%";


        balloon.style.animationDuration =
          (3 + Math.random() * 3) + "s";


        balloon.style.animationDelay =
          (index * .12) + "s";


        birthdayScene.appendChild(
          balloon
        );


        setTimeout(
          function() {

            balloon.remove();

          },
          7000
        );

      }
    );


    /* =====================
       HATI PUTIH 🤍
    ===================== */

    for (
      let i = 0;
      i < 25;
      i++
    ) {

      const heart =
        document.createElement("div");


      heart.className =
        "flying-heart";


      heart.innerHTML =
        "🤍";


      heart.style.left =
        (Math.random() * 100) + "vw";


      heart.style.animationDuration =
        (2.5 + Math.random() * 2) + "s";


      heart.style.animationDelay =
        (Math.random() * 1.5) + "s";


      document.body.appendChild(
        heart
      );


      setTimeout(
        function() {

          heart.remove();

        },
        5000
      );

    }

  }
);

  </script>
